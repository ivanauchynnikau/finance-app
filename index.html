<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#121212" />
    
    <!-- Primary Meta Tags -->
    <title>Finance App - Учет личных финансов</title>
    <meta name="title" content="Finance App - Учет личных финансов" />
    <meta name="description" content="Простое и удобное мобильное приложение для учета личных финансов с системой категорий и визуализацией расходов" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finance" />
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
        z-index: 9999;
      }
      
      .dark #app-loader {
        background: linear-gradient(135deg, #0f1419 0%, #1a2228 100%);
      }
      
      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(52, 211, 153, 0.2);
        border-top-color: #34d399;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      .loader-text {
        margin-top: 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 16px;
        font-weight: 500;
        color: #059669;
      }
      
      .dark .loader-text {
        color: #34d399;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      .loader-logo {
        font-size: 48px;
        margin-bottom: 20px;
        animation: pulse 2s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
    </style>
  </head>

  <body>
    <div id="app-loader">
      <div class="loader-logo">💰</div>
      <div class="loader-spinner"></div>
      <div class="loader-text">Загрузка Finance App...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
